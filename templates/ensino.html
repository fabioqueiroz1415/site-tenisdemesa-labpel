<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labpel - Ensino</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      perspective: 1000px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: #000;
      padding: 20px;
    }

    .menu-link {
      display: inline-block;
      background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
      color: #cc6ce7;
      text-decoration: none;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      border: 1px solid rgba(204, 108, 231, 0.3);
    }

    .menu-link:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
      border-color: #cc6ce7;
      box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
    }

    .menu-link:active {
      color: #444;
    }

    .share-link {
      display: inline-block;
      background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
      color: #cc6ce7;
      text-decoration: none;
      margin-left: 10px;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      border: 1px solid rgba(204, 108, 231, 0.3);
      cursor: pointer;
    }

    .share-link:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
      border-color: #cc6ce7;
      box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
    }

    .share-link:active {
      color: #444;
    }

    h1 {
      color: #cc6ce7;
      margin-bottom: 10px;
      font-size: 2em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .controls {
      background-color: #0a0a0a;
      padding: 20px;
      margin: 20px 0;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: bold;
      color: #cc6ce7;
    }

    select, input {
      background: #2c2c3e;
      color: #e0e0e0;
      border: 1px solid #cc6ce7;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
    }

    select:hover, input:hover {
      background: #3c3c5e;
    }

    button {
      background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
      color: #cc6ce7;
      border: 1px solid rgba(204, 108, 231, 0.3);
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
      border-color: #cc6ce7;
      box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
    }

    button:active {
      color: #444;
    }

    .aula-content {
      background-color: #0a0a0a;
      border-radius: 10px;
      padding: 30px;
      margin-top: 20px;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    .aula-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #cc6ce7;
      flex-wrap: wrap;
      gap: 10px;
    }

    .aula-title {
      color: #cc6ce7;
      font-size: 1.5em;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .edit-btn, .share-btn {
      background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
      color: #cc6ce7;
    }

    .edit-btn:hover, .share-btn:hover {
      background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
      border-color: #cc6ce7;
    }

    .markdown-body {
      color: #e0e0e0;
      line-height: 1.6;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: #cc6ce7;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .markdown-body h1 {
      border-bottom: 2px solid #cc6ce7;
      padding-bottom: 10px;
    }

    .markdown-body h2 {
      border-left: 3px solid #cc6ce7;
      padding-left: 15px;
    }

    .markdown-body ul, .markdown-body ol {
      margin-left: 25px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .markdown-body li {
      margin: 5px 0;
    }

    .markdown-body p {
      margin: 10px 0;
    }

    .markdown-body code {
      background: #2c2c3e;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    .markdown-body pre {
      background: #2c2c3e;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 15px 0;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin: 20px 0;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }

    .empty-message, .error-message {
      background-color: #0a0a0a;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      color: #888;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    .error-message {
      color: #ff6b6b;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #cc6ce7;
    }

    .success-message {
      background-color: #0a0a0a;
      border: 1px solid #cc6ce7;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      text-align: center;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0a0a0a;
      color: #cc6ce7;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid #cc6ce7;
      z-index: 1000;
      animation: fadeInOut 2s ease-in-out;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .control-group {
        justify-content: space-between;
      }

      .aula-header {
        flex-direction: column;
        align-items: stretch;
      }

      .button-group {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="menu-link"> Voltar ao Menu</a>
    <h1>Ensino - Labpel Tenis de Mesa</h1>

    <div class="controls">
      <div class="control-group">
        <label>Turma:</label>
        <select id="tipo">
          <option value="iniciacao">Iniciacao</option>
          <option value="aprimoramento">Aprimoramento</option>
        </select>
      </div>

      <div class="control-group">
        <label>Data:</label>
        <input type="date" id="data-input" />
      </div>

      <button id="carregar-btn">Carregar Aula</button>
    </div>

    <div id="conteudo">
      <div class="loading">Selecione uma data e clique em Carregar Aula</div>
    </div>
  </div>

  <script>
    let aulaAtual = null;
    let maiorNumeroAula = 0;

    // Recebe os parâmetros do Flask
    const tipoParam = "{{ tipo_param }}";
    const dataParam = "{{ data_param }}";
    const numeroParam = "{{ numero_param }}";

    function formatarDataParaArquivo(dataStr) {
      const [ano, mes, dia] = dataStr.split("-");
      const anoCurto = ano.slice(-2);
      return `${dia}-${mes}-${anoCurto}`;
    }

    function formatarDataParaExibicao(dataArquivo) {
      const [d, m, a] = dataArquivo.split("-");
      return `${d}/${m}/20${a}`;
    }

    function formatarDataParaInput(dataArquivo) {
      const [d, m, a] = dataArquivo.split("-");
      const ano = parseInt(a) + 2000;
      return `${ano}-${m}-${d}`;
    }

    function getDataHoje() {
      const hoje = new Date();
      const ano = hoje.getFullYear();
      const mes = String(hoje.getMonth() + 1).padStart(2, '0');
      const dia = String(hoje.getDate()).padStart(2, '0');
      return `${ano}-${mes}-${dia}`;
    }

    function getDataArquivoHoje() {
      return formatarDataParaArquivo(getDataHoje());
    }

    function showToast(mensagem) {
      const existingToast = document.querySelector('.toast');
      if (existingToast) existingToast.remove();

      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = mensagem;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 2000);
    }

    function atualizarURL(tipo, dataArquivo, numero) {
      const url = new URL(window.location.href);
      url.searchParams.set('tipo', tipo);
      url.searchParams.set('data', dataArquivo);
      url.searchParams.set('numero', numero);
      window.history.pushState({}, '', url);
    }

    async function copiarLinkCompartilhamento() {
      const tipo = document.getElementById("tipo").value;
      const dataInput = document.getElementById("data-input").value;

      if (!dataInput) {
        alert("Selecione uma data primeiro!");
        return;
      }

      const dataArquivo = formatarDataParaArquivo(dataInput);

      // Busca o número da aula atual
      try {
        const response = await fetch(`/api/ensino/carregar_aula?tipo=${tipo}&data=${dataArquivo}`);
        const data = await response.json();

        if (data.exists) {
          // Extrai o número da aula do nome do arquivo
          const match = data.nome_arquivo.match(/Aula(\d+)/);
          if (match) {
            const numero = match[1];
            const linkCompartilhamento = `${window.location.origin}/ensino?tipo=${tipo}&data=${dataArquivo}&numero=${numero}`;

            await navigator.clipboard.writeText(linkCompartilhamento);
            showToast("Link copiado! Compartilhe com seus alunos.");
          } else {
            alert("Nao foi possivel extrair o numero da aula.");
          }
        } else {
          alert("Nenhuma aula encontrada para esta data.");
        }
      } catch (error) {
        console.error("Erro ao obter aula:", error);
        alert("Erro ao gerar link de compartilhamento.");
      }
    }

    async function carregarMaiorNumeroAula() {
      const tipo = document.getElementById("tipo").value;
      try {
        const response = await fetch(`/api/ensino/listar_aulas?tipo=${tipo}`);
        const data = await response.json();
        maiorNumeroAula = data.maior_numero;
        console.log(`Maior numero de aula: ${maiorNumeroAula}`);
      } catch (error) {
        console.error("Erro ao carregar maior numero:", error);
        maiorNumeroAula = 0;
      }
    }

    // Função simples que pega qualquer link e coloca em iframe
    function processVideoInIframe(content) {
      // Regex para encontrar !videoiniframe[qualquer texto]
      const regex = /!videoiniframe\[([^\]]+)\]/g;

      let processedContent = content;
      let match;

      while ((match = regex.exec(content)) !== null) {
        const fullMatch = match[0];
        const url = match[1].trim();

        // Gera iframe com o link exatamente como foi fornecido
        const iframeHtml = `<div class="video-container">
          <iframe
            src="${url}"
            title="Conteúdo incorporado"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>`;

        // Substitui a sintaxe pelo iframe
        processedContent = processedContent.replace(fullMatch, iframeHtml);
      }

      return processedContent;
    }

    // Função principal para renderizar Markdown com suporte a iframes
    function renderMarkdownWithVideos(markdownContent) {
      // Primeiro processa a sintaxe !videoiniframe
      const contentWithIframes = processVideoInIframe(markdownContent);

      // Depois converte o restante do Markdown para HTML
      const htmlContent = marked.parse(contentWithIframes);

      return htmlContent;
    }

    async function carregarAula(dataEspecifica = null, numeroEspecifico = null) {
      const tipo = document.getElementById("tipo").value;
      let inputDate = dataEspecifica || document.getElementById("data-input").value;

      if (!inputDate) {
        alert("Selecione uma data!");
        return;
      }

      const dataArquivo = formatarDataParaArquivo(inputDate);
      const dataExibicao = formatarDataParaExibicao(dataArquivo);
      const conteudoDiv = document.getElementById("conteudo");

      conteudoDiv.innerHTML = '<div class="loading">Carregando aula...</div>';

      try {
        let url = `/api/ensino/carregar_aula?tipo=${tipo}&data=${dataArquivo}`;
        if (numeroEspecifico) {
          url += `&numero=${numeroEspecifico}`;
        }

        const response = await fetch(url);
        const data = await response.json();

        if (data.exists) {
          // Usa a nova função para renderizar com suporte a iframes
          const htmlContent = renderMarkdownWithVideos(data.conteudo);
          aulaAtual = data;

          const nomeTurma = tipo === "iniciacao" ? "Iniciacao" : "Aprimoramento";

          // Extrai o número da aula para o link de compartilhamento e URL
          const match = data.nome_arquivo.match(/Aula(\d+)/);
          const numeroAula = match ? match[1] : "";

          // Atualiza a URL com os parâmetros atuais
          atualizarURL(tipo, dataArquivo, numeroAula);

          conteudoDiv.innerHTML = `
            <div class="aula-content">
              <div class="aula-header">
                <div class="aula-title">
                  ${data.nome_arquivo.replace('.md', '')} - ${nomeTurma}
                </div>
                <div class="button-group">
                  <button class="share-btn" onclick="copiarLinkCompartilhamento()"> Copiar link</button>
                  <button class="edit-btn" onclick="abrirAula()">Abrir no GitHub</button>
                </div>
              </div>
              <div class="markdown-body">
                ${htmlContent}
              </div>
            </div>
          `;
        } else {
          await carregarMaiorNumeroAula();
          const novoNumero = maiorNumeroAula + 1;

          // Remove os parâmetros da URL quando não há aula
          const url = new URL(window.location.href);
          url.searchParams.delete('tipo');
          url.searchParams.delete('data');
          url.searchParams.delete('numero');
          window.history.pushState({}, '', url);

          conteudoDiv.innerHTML = `
            <div class="empty-message">
              <p>Nenhuma aula encontrada para a data ${dataExibicao}.</p>
              <p><small>Turma: ${tipo === "iniciacao" ? "Iniciacao" : "Aprimoramento"}</small></p>
              <button onclick="criarAula(${novoNumero})" style="margin-top: 20px;">
                Criar Aula ${novoNumero} para ${dataExibicao}
              </button>
            </div>
          `;
        }
      } catch (error) {
        console.error("Erro detalhado:", error);
        conteudoDiv.innerHTML = `<div class="error-message">
                                  <p>Erro ao carregar a aula: ${error.message}</p>
                                </div>`;
      }
    }

    async function abrirAula() {
      if (aulaAtual && aulaAtual.url) {
        window.open(aulaAtual.url, '_blank');
      } else {
        alert("URL da aula nao disponivel");
      }
    }

    async function criarAula(numero) {
      const tipo = document.getElementById("tipo").value;
      const inputDate = document.getElementById("data-input").value;

      if (!inputDate) {
        alert("Selecione uma data!");
        return;
      }

      const dataArquivo = formatarDataParaArquivo(inputDate);
      const dataExibicao = formatarDataParaExibicao(dataArquivo);

      if (!confirm(`Criar nova Aula ${numero} para a turma de ${tipo === "iniciacao" ? "Iniciacao" : "Aprimoramento"} na data ${dataExibicao}?`)) {
        return;
      }

      const conteudoDiv = document.getElementById("conteudo");
      conteudoDiv.innerHTML = '<div class="loading">Criando nova aula...</div>';

      try {
        const response = await fetch("/api/ensino/criar_aula", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            tipo: tipo,
            data: dataArquivo,
            numero: numero
          })
        });

        const data = await response.json();

        if (data.ok) {
          // Após criar, carrega a aula automaticamente
          await carregarAula(inputDate, numero);
        } else {
          conteudoDiv.innerHTML = `
            <div class="error-message">
              <p>Erro ao criar aula: ${data.error?.message || "Erro desconhecido"}</p>
            </div>
          `;
        }
      } catch (error) {
        conteudoDiv.innerHTML = `<div class="error-message">
                                  <p>Erro ao criar aula: ${error.message}</p>
                                </div>`;
      }
    }

    // Inicialização
    document.getElementById("tipo").addEventListener("change", () => {
      carregarMaiorNumeroAula();
    });

    document.getElementById("carregar-btn").addEventListener("click", () => carregarAula());

    // Configura a data inicial
    if (dataParam && dataParam !== "None") {
      // Se tem parâmetro de data, usa ele
      const dataInput = formatarDataParaInput(dataParam);
      document.getElementById("data-input").value = dataInput;
      document.getElementById("tipo").value = tipoParam || "iniciacao";

      // Carrega a aula com os parâmetros
      carregarMaiorNumeroAula().then(() => {
        carregarAula(dataParam, numeroParam && numeroParam !== "None" ? numeroParam : null);
      });
    } else {
      // Sem parâmetros, carrega a aula do dia atual
      document.getElementById("data-input").value = getDataHoje();
      carregarMaiorNumeroAula().then(() => {
        carregarAula();
      });
    }
  </script>
</body>
</html>
