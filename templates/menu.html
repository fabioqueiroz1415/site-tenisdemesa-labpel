<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labpel - Tenis de Mesa | Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      perspective: 1000px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #000;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #cc6ce7;
      margin-bottom: 30px;
      font-size: 2em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    table {
      border-collapse: collapse;
      background-color: #000;
      color: white;
      width: 100%;
      transition: all 1s;
    }

    tr, td {
      text-align: center;
      font-size: 1.5rem;
      overflow: hidden;
      white-space: nowrap;
      transition: all 1s;
      padding: 15px;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    .link {
      display: block;
      text-align: center;
      font-size: 1.2rem;
      color: #cc6ce7;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .link:hover {
      color: #dd88ff;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }

      h1 {
        font-size: 1.5em;
      }

      .link {
        font-size: 1rem;
      }

      tr, td {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gestao de Turmas - Labpel Tenis de Mesa</h1>
    <table>
      <tr class="margem-inferior">
        <td>
          <a class="link" href="/historico">Alunos</a>
        </td>
      </tr>
      <tr class="margem-inferior">
        <td>
          <a class="link" href="/ensino">Ensino</a>
        </td>
      </tr>
      <tr class="margem-inferior">
        <td>
          <a class="link" href="/links">Placar</a>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
