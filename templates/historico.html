<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labpel - Histórico</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: #000;
      padding: 20px;
    }

    h1 {
      color: #cc6ce7;
      margin-bottom: 30px;
      font-size: 2em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .controls {
      display: grid;
      grid-template-columns: auto auto 1fr;
      align-items: center;
      gap: 14px 28px;
      padding: 6px 0 18px;
      margin-bottom: 18px;
      border: none;
      background: transparent;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-label {
      color: #777;
      font-size: 0.85em;
    }

    .info-select,
    select {
      appearance: none;
      -webkit-appearance: none;
      background: transparent !important;
      color: #cc6ce7;
      border: none !important;
      outline: none;
      box-shadow: none !important;
      padding: 3px 18px 3px 0;
      border-radius: 0;
      font-size: 0.9em;
      font-weight: 500;
      cursor: pointer;
    }

    select:hover,
    select:focus {
      background: transparent !important;
      color: #dd88ff;
      border: none !important;
      box-shadow: none !important;
    }

    .info-select option {
      background: #111;
      color: #e0e0e0;
    }

    .info-value {
      color: #cc6ce7;
      font-size: 0.9em;
      font-weight: 500;
    }

    .info-button {
      background: transparent !important;
      color: #d48cff;
      border: 1px solid transparent !important;
      outline: none;
      box-shadow: none !important;
      padding: 3px 4px;
      border-radius: 0;
      font-size: 0.82em;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s ease;
      text-decoration: underline;
    }

    .info-button:hover {
      background: transparent !important;
      color: #dd88ff;
      border-color: transparent !important;
      box-shadow: none !important;
      transform: none;
    }

    .reload-btn {
      padding: 3px 4px;
      font-size: 0.82em;
      border: 1px solid transparent !important;
      color: #cc6ce7;
      background: transparent !important;
    }

    .reload-btn:hover {
      color: #dd88ff;
      border-color: transparent !important;
      box-shadow: none !important;
      transform: none;
    }

    .total-info {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      padding: 2px 0 14px;
      color: #888;
      font-size: 0.9em;
    }

    .total-info .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .total-info .info-button {
      margin-left: 2px;
    }

    .historico-container {
      overflow-x: auto;
      margin-top: 20px;
      background-color: #0a0a0a;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 10px 0;
      display: flex;
      justify-content: center;
    }

    .historico-table {
      width: max-content;
      margin: 0 auto;
      border-collapse: collapse;
      table-layout: auto;
    }

    .historico-table th,
    .historico-table td {
      width: 1px;
      white-space: nowrap;
      border-left: 1px solid #333;
      border-right: 1px solid #333;
    }

    .historico-table th {
      background: #1a1a2e;
      color: #cc6ce7;
      padding: 6px 4px;
      text-align: center;
      border-bottom: 2px solid #cc6ce7;
      font-size: 0.85em;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-mais {
      background: #1a1a2e;
      color: #cc6ce7;
      font-size: 1.2em;
      cursor: pointer;
      text-align: center;
      vertical-align: middle;
      width: 30px;
      min-width: 30px;
      max-width: 30px;
    }
    .header-mais:hover { background: #2a2a4e; }

    .historico-table th.data-cell {
      width: 28px !important;
      min-width: 28px !important;
      max-width: 28px !important;
      height: 45px;
      padding: 0;
      background: #1a1a2e;
      border-bottom: 2px solid #cc6ce7;
      cursor: pointer;
      text-align: center;
      vertical-align: bottom;
    }

    .historico-table th.data-cell:hover,
    .historico-table th.col-nome:hover,
    .historico-table th.col-freq:hover {
      background: #2a2a4e;
    }

    .historico-table th.data-cell .dia-texto {
      display: inline-block;
      transform: rotate(-45deg);
      transform-origin: center;
      white-space: nowrap;
      font-size: 1em;
    }

    .historico-table .col-nome {
      text-align: left;
      font-weight: bold;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: #0a0a0a;
      position: sticky;
      left: 0;
      z-index: 5;
    }

    .historico-table th.col-nome {
      background: #1a1a2e;
      z-index: 11;
      cursor: pointer;
      user-select: none;
    }

    .historico-table .col-freq {
      text-align: center;
      background: #0a0a0a;
      position: sticky;
      left: var(--freq-col-left, 0px);
      z-index: 5;
      white-space: nowrap;
      min-width: 70px;
      width: 70px;
    }

    .historico-table th.col-freq {
      background: #1a1a2e;
      z-index: 11;
      cursor: pointer;
      user-select: none;
    }

    .data-cell {
      width: 20px !important;
      min-width: 20px !important;
      max-width: 20px !important;
      padding: 2px 0 !important;
      text-align: center !important;
      vertical-align: middle !important;
      white-space: nowrap;
      overflow: hidden;
    }

    .historico-table td.data-cell {
      background: #0a0a0a;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }

    .historico-table tr:hover td.data-cell {
      background: rgba(204, 108, 231, 0.05);
    }

    .bola-presenca,
    .bola-ausente,
    .bola-cinza {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .bola-presenca {
      background-color: #cc6ce7;
      box-shadow: 0 0 10px rgba(204, 108, 231, 0.4);
    }

    .bola-presenca:hover {
      transform: scale(1.2);
      box-shadow: 0 0 20px rgba(204, 108, 231, 0.6);
    }

    .bola-ausente {
      background-color: #1a1a1a;
      border: 2px solid #777;
    }

    .bola-cinza {
      background-color: #555;
      border: 1px solid #666;
      cursor: pointer;
    }

    .freq-grafico-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .freq-grafico-container canvas {
      display: block;
    }

    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .no-data .icon {
      font-size: 3em;
      display: block;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #cc6ce7;
    }

    .historico-container::-webkit-scrollbar {
      height: 8px;
    }

    .historico-container::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    .historico-container::-webkit-scrollbar-thumb {
      background: #cc6ce7;
      border-radius: 4px;
    }

    .historico-container::-webkit-scrollbar-thumb:hover {
      background: #dd88ff;
    }

    .sort-indicator {
      display: inline-block;
      margin-left: 6px;
      font-size: 0.8em;
      color: #cc6ce7;
    }

    .status-texto {
      display: flex;
      gap: 20px;
      color: #888;
      font-size: 0.85em;
      margin-top: 10px;
      padding: 10px 0;
      border-top: 1px solid #333;
      flex-wrap: wrap;
    }

    .status-texto .legenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-texto .bola-pequena {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .status-texto .bola-pequena.presente {
      background-color: #cc6ce7;
    }

    .status-texto .bola-pequena.ausente {
      border: 1px solid #333;
      background-color: transparent;
    }

    .status-texto .bola-pequena.cinza {
      background-color: #555;
      border: 1px solid #666;
    }

    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .popup-overlay.active { display: flex; }

    .popup-box {
      background: #1a1a2e;
      border: 1px solid #cc6ce7;
      border-radius: 12px;
      padding: 30px;
      max-width: 350px;
      width: 90%;
      box-shadow: 0 0 40px rgba(204,108,231,0.3);
      text-align: center;
    }

    .popup-box h3 { color: #cc6ce7; margin-bottom: 20px; }

    .popup-box input[type="date"] {
      background: #2c2c3e;
      color: #e0e0e0;
      border: 1px solid #cc6ce7;
      padding: 10px;
      border-radius: 6px;
      font-size: 1em;
      width: 100%;
      margin-bottom: 20px;
    }

    .popup-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .popup-buttons button { padding: 8px 20px; }

    @media (max-width: 768px) {
      body {
        padding: 0;
      }

      .container {
        width: 100%;
        max-width: none;
        padding: 0;
      }

      h1 {
        padding: 15px 15px 0;
      }

      .total-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 18px;
        padding: 0 15px 14px;
      }

      .total-info .info-item {
        min-width: 0;
      }

      .total-info .info-button {
        justify-self: start;
      }

      .historico-container {
        justify-content: flex-start;
      }

      .historico-table {
        min-width: 100%;
      }

      .historico-table th,
      .historico-table td {
        padding: 4px 2px;
        font-size: 0.75em;
      }

      .bola-presenca,
      .bola-ausente,
      .bola-cinza {
        width: 14px;
        height: 14px;
      }

      .data-cell {
        width: 16px !important;
        min-width: 16px !important;
        max-width: 16px !important;
      }

      .historico-table th.data-cell {
        width: 22px !important;
        min-width: 22px !important;
        max-width: 22px !important;
        height: 35px;
      }

      .historico-table .col-freq {
        min-width: 50px;
        width: 50px;
      }

      .status-texto {
        padding: 10px 15px;
      }
    }

    @media (max-width: 480px) {
      .bola-presenca,
      .bola-ausente,
      .bola-cinza {
        width: 12px;
        height: 12px;
      }

      .data-cell {
        width: 14px !important;
        min-width: 14px !important;
        max-width: 14px !important;
      }

      .historico-table th.data-cell {
        width: 18px !important;
        min-width: 18px !important;
        max-width: 18px !important;
        height: 30px;
      }

      .historico-table th,
      .historico-table td {
        padding: 2px 1px;
        font-size: 0.65em;
      }

      .historico-table .col-freq {
        min-width: 40px;
        width: 40px;
      }

      .status-texto .bola-pequena {
        width: 10px;
        height: 10px;
      }
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Histórico</h1>

  <div id="total-info" class="total-info">
    <div class="info-item"><span class="info-label">Turma:</span><select id="tipo" class="info-select"><option value="">Selecione...</option><option value="iniciacao">Iniciação</option><option value="aprimoramento">Aprimoramento</option></select></div>
    <div class="info-item"><span class="info-label">Período:</span><select id="periodo" class="info-select"><option value="all">Qualquer período</option></select></div>
    <div class="info-item"><span class="info-label">Aulas:</span><span id="quantidade-aulas" class="info-value">0</span></div>
    <button onclick="abrirGitHubAlunos()" class="info-button">gerenciar alunos</button>
    <button onclick="abrirGitHubPeriodos()" class="info-button">gerenciar períodos</button>
    <button onclick="carregarHistorico()" class="info-button">recarregar</button>
  </div>

  <div class="historico-container" id="historico-container">
    <div id="conteudo-historico" class="no-data">
      <span class="icon">📋</span>
      Selecione uma turma e um período.
    </div>
  </div>

  <div class="status-texto" id="legenda">
    <span class="legenda-item">
      <span class="bola-pequena presente"></span>
      Presente
    </span>

    <span class="legenda-item">
      <span class="bola-pequena ausente"></span>
      Ausente
    </span>
  </div>
</div>

<!-- Popup calendário -->
<div class="popup-overlay" id="popup-calendario">
  <div class="popup-box">
    <h3>📅 Escolha a data</h3>
    <input type="date" id="input-data">
    <div class="popup-buttons">
      <button onclick="fecharPopup()">Cancelar</button>
      <button onclick="criarFrequencia()" style="background: #cc6ce7; color: #000;">Ok</button>
    </div>
  </div>
</div>

<script>
  let dadosHistorico = {
    alunos: [],
    registros: [],
    datasDisponiveis: [],
    presencasPorAluno: {},
    totalAulas: 0
  };

  let periodos = [];

  let ordemAtual = {
    tipo: null,
    direcao: null
  };

  let githubPeriodosUrl = '';
  let githubUrl = '';

  const meses = [
    'jan', 'fev', 'mar', 'abr', 'mai', 'jun',
    'jul', 'ago', 'set', 'out', 'nov', 'dez'
  ];

  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('tipo').addEventListener('change', async () => {
      ordemAtual = { tipo: null, direcao: null };
      const tipo = document.getElementById('tipo').value;

      if (!tipo) {
        githubUrl = '';
        mostrarMensagem('Selecione uma turma para visualizar o histórico.');
        atualizarTotalInfo();
        return;
      }

      await carregarHistorico();
      await carregarGitHubAlunos();
    });

    document.getElementById('periodo').addEventListener('change', async () => {
      ordemAtual = { tipo: null, direcao: null };
      const tipo = document.getElementById('tipo').value;

      if (!tipo) {
        mostrarMensagem('Período selecionado. Agora selecione uma turma para visualizar o histórico.');
        atualizarTotalInfo();
        return;
      }

      await carregarHistorico();
    });

    await carregarPeriodos();
  });

  async function carregarPeriodos() {
    const periodoSelect = document.getElementById('periodo');

    try {
      const resposta = await fetch('/api/periodos');
      const json = await resposta.json();

      if (!resposta.ok || !json.ok) {
        throw new Error(json.erro?.message || json.erro || 'Não foi possível carregar os períodos.');
      }

      periodos = json.periodos || [];
      githubPeriodosUrl = json.github_url || '';

      periodoSelect.innerHTML = '<option value="all" selected>Qualquer período</option>';
      periodos.forEach((periodo, index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = periodo.rotulo;
        periodoSelect.appendChild(option);
      });
      periodoSelect.disabled = false;
    } catch (error) {
      console.error(error);
      periodoSelect.innerHTML = '<option value="all" selected>Qualquer período</option>';
      periodoSelect.disabled = false;
      mostrarMensagem('Não foi possível carregar os períodos.');
    }
  }

  async function carregarGitHubAlunos() {
    const tipo = document.getElementById('tipo').value;
    if (!tipo) { githubUrl = ''; return; }

    try {
      const resposta = await fetch(`/api/alunos/carregar?tipo=${encodeURIComponent(tipo)}`);
      const json = await resposta.json();
      githubUrl = json.github_url || '';
    } catch (error) {
      console.error(error);
      githubUrl = '';
    }
  }

  function abrirGitHubAlunos() {
    if (githubUrl && githubUrl !== '#') {
      window.open(githubUrl, '_blank');
    } else {
      alert('Selecione uma turma para abrir o arquivo de alunos no GitHub.');
    }
  }

  // Mantido para compatibilidade caso outra parte da página use esta função.
  function abrirGitHubPeriodos() {
    if (githubPeriodosUrl) {
      window.open(githubPeriodosUrl, '_blank');
    }
  }

  async function recarregarTabela() {
    const tipo = document.getElementById('tipo').value;
    if (!tipo) {
      mostrarMensagem('Selecione uma turma.');
      return;
    }
    await carregarHistorico();
  }

  async function carregarHistorico() {
    const tipo = document.getElementById('tipo').value;
    if (!tipo) {
      mostrarMensagem('Selecione uma turma para visualizar o histórico.');
      atualizarTotalInfo();
      return;
    }

    const periodo = obterPeriodoSelecionado();
    mostrarLoading();

    try {
      const resposta = await fetch(`/api/presenca/historico?tipo=${encodeURIComponent(tipo)}`);
      const json = await resposta.json();

      if (!resposta.ok || !json.ok) {
        throw new Error(json.error || json.erro || 'Erro ao carregar histórico.');
      }

      dadosHistorico = json;
      await carregarGitHubAlunos();
      renderizarHistorico(periodo);
    } catch (error) {
      console.error(error);
      mostrarMensagem('Erro ao carregar o histórico: ' + error.message);
      atualizarTotalInfo();
    }
  }

  function dataParaDate(data) {
    const partes = data.split('-');

    if (partes.length !== 3) {
      return null;
    }

    return new Date(
      Number(partes[0]),
      Number(partes[1]) - 1,
      Number(partes[2])
    );
  }

  function dataBrParaDate(data) {
    const partes = data.split('-');

    if (partes.length !== 3) {
      return null;
    }

    let ano = Number(partes[2]);

    if (ano < 70) {
      ano += 2000;
    } else {
      ano += 1900;
    }

    return new Date(
      ano,
      Number(partes[1]) - 1,
      Number(partes[0])
    );
  }

  function formatarDiaCabecalho(data) {
    const date = dataBrParaDate(data);

    if (!date) {
      return data;
    }

    return String(date.getDate()).padStart(2, '0');
  }

  function getSortIndicator(tipo) {
    if (ordemAtual.tipo !== tipo) {
      return '';
    }

    const dir = ordemAtual.direcao === 'asc' ? '↑' : '↓';

    return `<span class="sort-indicator">${dir}</span>`;
  }

  function ordenarPorNome(periodo) {
    if (ordemAtual.tipo === 'nome') {
      ordemAtual.direcao =
        ordemAtual.direcao === 'asc' ? 'desc' : 'asc';
    } else {
      ordemAtual.tipo = 'nome';
      ordemAtual.direcao = 'asc';
    }

    renderizarHistorico(periodo);
  }

  function ordenarPorFrequencia(periodo) {
    if (ordemAtual.tipo === 'frequencia') {
      ordemAtual.direcao =
        ordemAtual.direcao === 'asc' ? 'desc' : 'asc';
    } else {
      ordemAtual.tipo = 'frequencia';
      ordemAtual.direcao = 'desc';
    }

    renderizarHistorico(periodo);
  }

  function obterRegistrosDoPeriodo(periodo) {
    const registros = [...(dadosHistorico.registros || [])];

    if (!periodo) {
      return registros.sort((a, b) => a.data.localeCompare(b.data));
    }

    const inicio = dataParaDate(periodo.inicio_iso);
    const fim = dataParaDate(periodo.fim_iso);

    if (!inicio || !fim) return [];

    return registros
      .filter(registro => {
        const data = dataBrParaDate(registro.data_br);
        return data && data >= inicio && data <= fim;
      })
      .sort((a, b) => a.data.localeCompare(b.data));
  }

  function obterDadosAlunos(periodo, registros) {
    const alunos = [...(dadosHistorico.alunos || [])];

    const dados = alunos.map(nome => {
      let presencas = 0;

      registros.forEach(registro => {
        if (
          (registro.presentes || []).includes(nome)
        ) {
          presencas++;
        }
      });

      const faltas = registros.length - presencas;

      const pct = registros.length
        ? Math.round((presencas / registros.length) * 100)
        : 0;

      return {
        nome,
        presencas,
        faltas,
        pct
      };
    });

    if (ordemAtual.tipo === 'nome') {
      dados.sort((a, b) => {
        const resultado =
          a.nome.localeCompare(
            b.nome,
            'pt-BR',
            { sensitivity: 'base' }
          );

        return ordemAtual.direcao === 'asc'
          ? resultado
          : -resultado;
      });
    }

    if (ordemAtual.tipo === 'frequencia') {
      dados.sort((a, b) => {
        const resultado = a.pct - b.pct;

        if (resultado !== 0) {
          return ordemAtual.direcao === 'asc'
            ? resultado
            : -resultado;
        }

        return a.nome.localeCompare(
          b.nome,
          'pt-BR',
          { sensitivity: 'base' }
        );
      });
    }

    return dados;
  }

  function renderizarHistorico(periodo) {
    const registros = obterRegistrosDoPeriodo(periodo);
    const alunos = obterDadosAlunos(periodo, registros);
    const container = document.getElementById('conteudo-historico');

    atualizarTotalInfo(registros, periodo);

    if (alunos.length === 0) {
      container.innerHTML = `
        <div class="no-data">
          <span class="icon">📋</span>
          Nenhum aluno cadastrado nesta turma.
        </div>
      `;
      return;
    }

    if (registros.length === 0) {
      container.innerHTML = `
        <div class="no-data">
          <span class="icon">📅</span>
          Nenhuma aula encontrada dentro do período selecionado.
        </div>
      `;
      return;
    }

    let html = `
      <table class="historico-table">
        <thead>
          <tr>
            <th
              class="col-nome"
              onclick="ordenarPorNome(obterPeriodoSelecionado())"
            >
              Nome${getSortIndicator('nome')}
            </th>

            <th
              class="col-freq"
              onclick="ordenarPorFrequencia(obterPeriodoSelecionado())"
            >
              Freq.${getSortIndicator('frequencia')}
            </th>
    `;

    registros.forEach(registro => {
      html += `
        <th class="data-cell" title="${registro.data_br}">
          <span class="dia-texto">
            ${formatarDiaCabecalho(registro.data_br)}
          </span>
        </th>
      `;
    });

    html += `
      <th class="header-mais" onclick="abrirPopup()" title="Criar frequência">+</th>
    `;

    html += `
          </tr>
        </thead>
        <tbody>
    `;

    alunos.forEach((aluno, indice) => {
      const canvasId = `freq-${indice}`;

      html += `
        <tr>
          <td
            class="col-nome"
            title="${escapeHtml(aluno.nome)}"
          >
            ${escapeHtml(formatarNome(aluno.nome))}
          </td>

          <td class="col-freq">
            <div class="freq-grafico-container">
              <canvas
                id="${canvasId}"
                width="40"
                height="40"
              ></canvas>
            </div>
          </td>
      `;

      registros.forEach(registro => {
        const presente =
          (registro.presentes || []).includes(aluno.nome);

        html += `
          <td class="data-cell" title="${presente ? 'Presente' : 'Ausente'}">
            <span class="${presente ? 'bola-presenca' : 'bola-ausente'}"></span>
          </td>
        `;
      });

      html += '<td class="header-mais" style="visibility:hidden">+</td>';
      html += '</tr>';
    });

    html += `
        </tbody>
      </table>
    `;

    container.innerHTML = html;

    // Faz a coluna de frequência começar exatamente depois da coluna de nome.
    requestAnimationFrame(() => {
      const nomeCabecalho =
        document.querySelector('.historico-table th.col-nome');

      if (nomeCabecalho) {
        const largura = nomeCabecalho.getBoundingClientRect().width;

        document.documentElement.style.setProperty(
          '--freq-col-left',
          `${largura}px`
        );
      }

      alunos.forEach((aluno, indice) => {
        desenharGrafico(
          `freq-${indice}`,
          aluno.pct
        );
      });
    });
  }

  function obterPeriodoSelecionado() {
    const valor = document.getElementById('periodo').value;
    if (valor === '' || valor === 'all') return null;
    return periodos[Number(valor)] || null;
  }

  function atualizarTotalInfo(registros = [], periodo = null) {
    const quantidade = document.getElementById("quantidade-aulas");
    if (quantidade) quantidade.textContent = registros.length;
  }

  function mostrarLoading() {
    document.getElementById('conteudo-historico').innerHTML = `
      <div class="loading">
        Carregando...
      </div>
    `;
  }

  function mostrarMensagem(mensagem) {
    document.getElementById('conteudo-historico').innerHTML = `
      <div class="no-data">
        <span class="icon">📋</span>
        ${escapeHtml(mensagem)}
      </div>
    `;
  }

  function abrirPopup() {
    const tipo = document.getElementById('tipo').value;
    if (!tipo) {
      alert('Selecione uma turma antes de criar uma frequência.');
      return;
    }
    document.getElementById('popup-calendario').classList.add('active');
    document.getElementById('input-data').value = new Date().toISOString().split('T')[0];
  }

  function fecharPopup() {
    document.getElementById('popup-calendario').classList.remove('active');
  }

  async function criarFrequencia() {
    const data = document.getElementById('input-data').value;
    const tipo = document.getElementById('tipo').value;

    if (!tipo) { alert('Selecione uma turma.'); return; }
    if (!data) { alert('Selecione uma data.'); return; }

    const partes = data.split('-');
    const dataFormatada = `${partes[2]}-${partes[1]}-${partes[0].slice(-2)}`;
    const alunos = dadosHistorico.alunos || [];

    if (alunos.length === 0) {
      alert('Nenhum aluno cadastrado.');
      fecharPopup();
      return;
    }

    try {
      const respCarregar = await fetch(`/api/presenca/carregar?tipo=${encodeURIComponent(tipo)}&data=${encodeURIComponent(dataFormatada)}`);
      const jsonCarregar = await respCarregar.json();

      const repoPath = githubUrl.replace('https://github.com/', '').split('/blob')[0] || '';
      const path = `${tipo}/frequencia/presencas/${dataFormatada}.txt`;
      const githubFileUrl = `https://github.com/${repoPath}/blob/main/${path}`;

      if (jsonCarregar.conteudo || jsonCarregar.sha) {
        window.open(jsonCarregar.github_url || githubFileUrl, '_blank');
        fecharPopup();
        return;
      }

      const respSalvar = await fetch('/api/presenca/salvar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo, data: dataFormatada, conteudo: alunos.join('\n'), sha: null })
      });

      const jsonSalvar = await respSalvar.json();
      if (!jsonSalvar.ok) {
        const mensagem = jsonSalvar.github?.message || jsonSalvar.error || 'Erro desconhecido';
        alert('Erro ao criar frequência: ' + mensagem);
        return;
      }

      window.open(jsonSalvar.github_url || githubFileUrl, '_blank');
      fecharPopup();
      setTimeout(() => carregarHistorico(), 500);
    } catch (error) {
      alert('Erro: ' + error.message);
    }
  }

  function formatarNome(nomeCompleto) {
    const partes = nomeCompleto.trim().split(/\s+/);

    if (partes.length === 0) {
      return '';
    }

    if (partes.length === 1) {
      return partes[0];
    }

    const primeiro = partes[0];
    const segundo = partes[1];
    const terceiro = partes[2] || '';

    if (segundo.length <= 2) {
      if (terceiro) {
        return `${primeiro} ${segundo} ${terceiro.charAt(0).toUpperCase()}.`;
      }

      return `${primeiro} ${segundo}`;
    }

    return `${primeiro} ${segundo.charAt(0).toUpperCase()}.`;
  }

  function escapeHtml(texto) {
    return String(texto)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function desenharGrafico(canvasId, porcentagemPresenca) {
    const canvas = document.getElementById(canvasId);

    if (!canvas) {
      return;
    }

    const ctx = canvas.getContext('2d');
    const tamanho = 40;

    canvas.width = tamanho;
    canvas.height = tamanho;

    const centroX = tamanho / 2;
    const centroY = tamanho / 2;
    const raio = tamanho / 2 - 2;

    ctx.clearRect(0, 0, tamanho, tamanho);

    ctx.beginPath();
    ctx.arc(
      centroX,
      centroY,
      raio,
      0,
      2 * Math.PI
    );

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (porcentagemPresenca > 0) {
      const anguloFinal =
        (porcentagemPresenca / 100) * 2 * Math.PI;

      ctx.beginPath();
      ctx.moveTo(centroX, centroY);

      ctx.arc(
        centroX,
        centroY,
        raio,
        -Math.PI / 2,
        -Math.PI / 2 + anguloFinal
      );

      ctx.closePath();
      ctx.fillStyle = '#cc6ce7';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(
      centroX,
      centroY,
      raio - 8,
      0,
      2 * Math.PI
    );

    ctx.fillStyle = '#0a0a0a';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
      centroX,
      centroY,
      raio - 8,
      0,
      2 * Math.PI
    );

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = 'bold 10px "Segoe UI"';
    ctx.fillStyle = '#cc6ce7';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillText(
      `${porcentagemPresenca}`,
      centroX,
      centroY
    );
  }
</script>
</body>
