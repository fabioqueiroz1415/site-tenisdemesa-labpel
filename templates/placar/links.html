<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links - Acesso Rápido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            perspective: 1000px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #000;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #cc6ce7;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn-voltar {
            display: block;
            width: 200px;
            margin: 0 auto 30px auto;
            background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
            color: #cc6ce7;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(204, 108, 231, 0.3);
            text-align: center;
            cursor: pointer;
        }

        .btn-voltar:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
            border-color: #cc6ce7;
            box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
            color: #dd88ff;
        }

        .btn-voltar:active {
            color: #444;
        }

        table {
            border-collapse: collapse;
            background-color: #000;
            color: white;
            width: 100%;
            transition: all 1s;
        }

        tr, td {
            text-align: center;
            font-size: 1.5rem;
            overflow: hidden;
            white-space: nowrap;
            transition: all 1s;
            padding: 15px;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        .link {
            display: block;
            text-align: center;
            font-size: 1.2rem;
            color: #cc6ce7;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .link:hover {
            color: #dd88ff;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 1.5em;
            }

            .link {
                font-size: 1rem;
            }

            tr, td {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn-voltar">← Voltar ao Menu</a>
        <h1>📱 Acesso Rápido - Placar</h1>
        <table>
            {% for key, url in links.items() %}
            <tr class="margem-inferior">
                <td>
                    <a class="link" href="{{ url }}">{{ key }}</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
