<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partida Única 1x1</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            perspective: 1000px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background-color: #000;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #cc6ce7;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-partida {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #0a0a0a;
            border-radius: 10px;
            color: #aaa;
            font-size: 1rem;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: bold;
            color: #cc6ce7;
            font-size: 1rem;
        }

        .input-group input {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #cc6ce7;
            background-color: #0a0a0a;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff9800;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.3);
        }

        .input-group input::placeholder {
            color: #555;
        }

        button {
            width: 100%;
            padding: 15px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.2s;
            background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
            color: #cc6ce7;
            border: 1px solid rgba(204, 108, 231, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
            border-color: #cc6ce7;
            box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
            color: #dd88ff;
        }

        button:active {
            transform: scale(0.98);
            color: #444;
        }

        .feedback {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        .feedback-success {
            background-color: #0a0a0a;
            color: #28a745;
            display: block;
            border-color: #28a745;
        }

        .separator {
            margin: 25px 0;
            border: none;
            border-top: 1px solid #333;
        }

        .link-voltar {
            text-align: center;
            margin-top: 20px;
        }

        .link-voltar a {
            display: inline-block;
            background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
            color: #cc6ce7;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(204, 108, 231, 0.3);
        }

        .link-voltar a:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
            border-color: #cc6ce7;
            box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
            color: #dd88ff;
        }

        .link-voltar a:active {
            color: #444;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }

            button, .link-voltar a {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 PARTIDA ÚNICA 1x1</h1>

        <div class="info-partida">
            Partida: única | Rodada: única
        </div>

        <div class="input-group">
            <label>
                Jogador 1:
                <input type="text" id="nome1-input" placeholder="Digite o nome do Jogador 1">
            </label>
            <label>
                Jogador 2:
                <input type="text" id="nome2-input" placeholder="Digite o nome do Jogador 2">
            </label>
        </div>

        <button onclick="atualizarNomes()">🔄 ATUALIZAR NOMES</button>

        <div id="feedback" class="feedback"></div>

        <hr class="separator">

        <div class="link-voltar">
            <a href="/links">← Voltar para Links</a>
        </div>
    </div>

    <script>
        var partida = {{ partida | tojson }};

        async function postPartida() {
            await fetch('/post-partida', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(partida)
            });
        }

        async function postPlacar() {
            const placar = {
                "quem-saca": 1,
                "pontos1": 0,
                "pontos2": 0,
                "set1": 0,
                "set2": 0,
                "cronometro": 0,
                "qr-code": 0
            };
            await fetch('/post-placar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(placar)
            });
        }

        async function reiniciarPartidaUnica() {
            await fetch('/reiniciar-partida-unica', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
        }

        async function atualizarNomes() {
            const nome1 = document.getElementById('nome1-input').value.trim();
            const nome2 = document.getElementById('nome2-input').value.trim();

            if (nome1 || nome2) {
                const response = await fetch('/atualizar-nomes-partida-unica', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome1, nome2 })
                });
                const data = await response.json();
                partida = data.partida;
            }

            // Reinicia o placar também
            await reiniciarPartidaUnica();
            await postPlacar();

            document.getElementById('nome1-input').value = '';
            document.getElementById('nome2-input').value = '';

            const feedback = document.getElementById('feedback');
            feedback.textContent = '✅ Nomes atualizados e partida reiniciada!';
            feedback.classList.add('feedback-success');

            setTimeout(() => {
                feedback.classList.remove('feedback-success');
                feedback.textContent = '';
            }, 2000);
        }

        async function init() {
            partida.rodada = "única";
            partida.partida = "única";
            await postPartida();
            await reiniciarPartidaUnica();
            await postPlacar();
        }

        init();
    </script>
</body>
</html>
