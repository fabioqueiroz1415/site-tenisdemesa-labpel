<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labpel - Gerenciar Alunos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      perspective: 1000px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background-color: #000;
      padding: 20px;
    }

    .menu-link {
      display: inline-block;
      background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
      color: #cc6ce7;
      text-decoration: none;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      border: 1px solid rgba(204, 108, 231, 0.3);
    }

    .menu-link:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
      border-color: #cc6ce7;
      box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
    }

    .menu-link:active {
      color: #444;
    }

    h1 {
      color: #cc6ce7;
      margin-bottom: 30px;
      font-size: 2em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .controls {
      background-color: #0a0a0a;
      padding: 20px;
      margin-bottom: 20px;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    label {
      font-weight: bold;
      margin-right: 10px;
      color: #cc6ce7;
    }

    select, input {
      background: #2c2c3e;
      color: #e0e0e0;
      border: 1px solid #cc6ce7;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1em;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #dd88ff;
      box-shadow: 0 0 5px rgba(204, 108, 231, 0.5);
    }

    button {
      background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
      color: #cc6ce7;
      border: 1px solid rgba(204, 108, 231, 0.3);
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 5px;
    }

    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
      border-color: #cc6ce7;
      box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
    }

    button:active {
      color: #444;
    }

    .button-group {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    #status {
      margin-left: 15px;
      font-weight: bold;
    }

    /* Estilos da tabela */
    .alunos-table {
      width: 100%;
      margin: 15px 0;
      background-color: #0a0a0a;
      border-collapse: collapse;
    }

    .alunos-table th {
      background: #1a1a2e;
      color: #cc6ce7;
      padding: 12px;
      text-align: left;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    .alunos-table td {
      padding: 12px;
      border-bottom: 1px solid #333;
      vertical-align: middle;
    }

    .alunos-table tr:hover {
      background: rgba(204, 108, 231, 0.05);
    }

    .nome-coluna {
      text-align: left;
    }

    .frequencia-coluna {
      text-align: center;
    }

    .acoes-coluna {
      text-align: center;
      width: 100px;
    }

    .aluno-nome {
      font-weight: bold;
    }

    .grafico-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
    }

    .btn-remover {
      background-color: #000;
      color: #cc6ce7;
      border: 1px solid #cc6ce7;
      padding: 6px 12px;
      font-size: 0.9em;
      margin: 0;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-remover:hover {
      background-color: #1a1a2e;
      border-color: #dd88ff;
      color: #dd88ff;
      transform: translateY(-1px);
    }

    .btn-remover:active {
      color: #444;
      border-color: #444;
    }

    .adicionar-area {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .adicionar-area input {
      flex: 1;
    }

    .total-alunos {
      text-align: right;
      padding: 10px 0;
      margin: 10px 0;
      color: #cc6ce7;
      font-size: 0.9em;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      background-color: #0a0a0a;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="menu-link"> Voltar ao Menu</a>
    <h1>Gerenciar Alunos - Labpel Tenis de Mesa</h1>

    <div class="controls">
      <label>Turma:</label>
      <select id="tipo">
        <option value="iniciacao">Iniciacao</option>
        <option value="aprimoramento">Aprimoramento</option>
      </select>
    </div>

    <table class="alunos-table" id="tabela-alunos">
      <thead>
        <tr>
          <th class="nome-coluna">Aluno</th>
          <th class="frequencia-coluna">Frequencia</th>
          <th class="acoes-coluna">Acoes</th>
        </tr>
      </thead>
      <tbody id="lista-alunos">
        <tr><td colspan="3">Carregando...</td></tr>
      </tbody>
    </table>

    <div id="total-alunos" class="total-alunos"></div>

    <div class="controls">
      <div class="adicionar-area">
        <input type="text" id="novo-aluno" placeholder="Nome do novo aluno">
        <button onclick="adicionar()">Adicionar</button>
      </div>
    </div>

    <div class="button-group">
      <button onclick="ordenar()">Ordenar alfabeticamente</button>
      <button onclick="salvar()">Salvar alteracoes</button>
      <span id="status"></span>
    </div>
  </div>

  <script>
    let alunos = [];
    let shaAtual = null;
    let timeoutStatus = null;
    let estatisticas = {};
    let totalAulas = 0;
    let graficos = {};

    function getTipo() {
      return document.getElementById("tipo").value;
    }

    function mostrarStatus(mensagem, isErro = false) {
      if (timeoutStatus) clearTimeout(timeoutStatus);
      const statusSpan = document.getElementById("status");
      statusSpan.textContent = mensagem;
      statusSpan.style.color = isErro ? "#ff6b6b" : "#cc6ce7";

      if (!isErro) {
        timeoutStatus = setTimeout(() => {
          if (statusSpan.textContent === mensagem) {
            statusSpan.textContent = "";
          }
          timeoutStatus = null;
        }, 3000);
      }
    }

    function atualizarTotalAlunos() {
      const totalDiv = document.getElementById("total-alunos");
      const quantidade = alunos.length;
      totalDiv.textContent = `Total: ${quantidade} aluno${quantidade !== 1 ? 's' : ''}`;
    }

    function desenharGrafico(canvasId, porcentagemPresenca) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const tamanho = 40;
      canvas.width = tamanho;
      canvas.height = tamanho;

      const centroX = tamanho / 2;
      const centroY = tamanho / 2;
      const raio = tamanho / 2 - 2;

      ctx.clearRect(0, 0, tamanho, tamanho);

      ctx.beginPath();
      ctx.arc(centroX, centroY, raio, 0, 2 * Math.PI);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (porcentagemPresenca > 0) {
        const anguloFinal = (porcentagemPresenca / 100) * 2 * Math.PI;
        ctx.beginPath();
        ctx.moveTo(centroX, centroY);
        ctx.arc(centroX, centroY, raio, -Math.PI / 2, -Math.PI / 2 + anguloFinal);
        ctx.closePath();
        ctx.fillStyle = '#cc6ce7';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(centroX, centroY, raio - 8, 0, 2 * Math.PI);
      ctx.fillStyle = '#0a0a0a';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(centroX, centroY, raio - 8, 0, 2 * Math.PI);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.font = 'bold 10px "Segoe UI"';
      ctx.fillStyle = '#cc6ce7';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${porcentagemPresenca}%`, centroX, centroY);
    }

    function removerAluno(index) {
      const nome = alunos[index];
      if (!confirm(`Remover "${nome}"?`)) return;
      alunos.splice(index, 1);
      renderizarTabela();
      atualizarTotalAlunos();
      mostrarStatus("Aluno removido. Nao esqueca de salvar!");
    }

    function renderizarTabela() {
      const tbody = document.getElementById("lista-alunos");
      tbody.innerHTML = "";

      if (!alunos || alunos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">Nenhum aluno cadastrado</td></tr>';
        atualizarTotalAlunos();
        return;
      }

      alunos.forEach((nome, index) => {
        const stats = estatisticas[nome] || { pct_presenca: 0 };
        const porcentagem = stats.pct_presenca || 0;

        const row = tbody.insertRow();

        // Coluna do nome
        const tdNome = row.insertCell(0);
        tdNome.className = "aluno-nome";
        tdNome.textContent = nome;

        // Coluna do gráfico
        const tdGrafico = row.insertCell(1);
        tdGrafico.className = "grafico-container";
        tdGrafico.style.textAlign = "center";

        const canvasId = `grafico-${index}-${Date.now()}`;
        tdGrafico.innerHTML = `<canvas id="${canvasId}" width="40" height="40"></canvas>`;

        // Coluna de ações
        const tdAcoes = row.insertCell(2);
        tdAcoes.className = "acoes-coluna";
        tdAcoes.style.textAlign = "center";

        const btnRemover = document.createElement("button");
        btnRemover.textContent = "Remover";
        btnRemover.className = "btn-remover";
        btnRemover.onclick = () => removerAluno(index);
        tdAcoes.appendChild(btnRemover);

        // Desenha o gráfico após adicionar ao DOM
        setTimeout(() => {
          desenharGrafico(canvasId, porcentagem);
        }, 10);
      });

      atualizarTotalAlunos();
    }

    async function carregarEstatisticas() {
      const tipo = getTipo();
      try {
        const respStats = await fetch(`/api/presenca/estatisticas?tipo=${tipo}`);
        const jsonStats = await respStats.json();
        estatisticas = jsonStats.stats || {};
        totalAulas = jsonStats.total_aulas || 0;
      } catch (error) {
        console.error("Erro ao carregar estatisticas:", error);
        estatisticas = {};
        totalAulas = 0;
      }
    }

    async function carregar() {
      mostrarStatus("Carregando...");
      const tipo = getTipo();

      await carregarEstatisticas();

      const respAlunos = await fetch(`/api/alunos/carregar?tipo=${tipo}`);
      const json = await respAlunos.json();
      alunos = json.alunos || [];
      shaAtual = json.sha || null;

      ordenar(false);
      renderizarTabela();
      mostrarStatus("");
    }

    function ordenar(mostrarMensagem = true) {
      alunos.sort((a, b) => a.localeCompare(b, 'pt-br'));
      renderizarTabela();
      if (mostrarMensagem) {
        mostrarStatus("Lista ordenada (nao salvo ainda)");
      }
    }

    function adicionar() {
      const input = document.getElementById("novo-aluno");
      const nome = input.value.trim();
      if (!nome) return;
      if (alunos.includes(nome)) {
        mostrarStatus("Aluno ja cadastrado!", true);
        return;
      }
      alunos.push(nome);
      ordenar(true);
      input.value = "";
      atualizarTotalAlunos();
    }

    async function salvar() {
      ordenar(false);

      const tipo = getTipo();
      mostrarStatus("Salvando...");

      const resp = await fetch("/api/alunos/salvar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tipo, alunos, sha: shaAtual })
      });

      const json = await resp.json();
      if (json.ok) {
        mostrarStatus("Salvo em ordem alfabetica!");
        await carregar();
      } else {
        mostrarStatus("Erro ao salvar: " + (json.github?.message || "Erro desconhecido"), true);
      }
    }

    document.getElementById("tipo").addEventListener("change", () => {
      carregar();
    });

    carregar();
  </script>
</body>
</html>
