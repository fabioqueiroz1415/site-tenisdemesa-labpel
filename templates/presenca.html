<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Presença</title>
</head>
<body>
  <p><a href="/">← Menu</a></p>
  <h1>Presença</h1>

  <label for="tipo"><strong>Turma:</strong></label>
  <select id="tipo">
    <option value="iniciacao" {% if tipo == 'iniciacao' %}selected{% endif %}>Iniciação</option>
    <option value="aprimoramento" {% if tipo == 'aprimoramento' %}selected{% endif %}>Aprimoramento</option>
  </select>

  <p><strong>Data:</strong> <span id="data-display">{{ hoje }}</span></p>

  <br>
  <strong>Alunos presentes:</strong><br>
  <div id="lista-alunos">Carregando...</div>
  <div id="debug" style="color:red;font-size:0.85em"></div>

  <br>
  <button onclick="salvar()">Enviar presença</button>
  <span id="status"></span>

  <script>
    let shaPresenca = null;

    function getData() {
      return "{{ hoje }}";
    }

    function getTipo() {
      return document.getElementById("tipo").value;
    }

    async function carregar() {
      document.getElementById("lista-alunos").textContent = "Carregando...";
      document.getElementById("status").textContent = "";
      document.getElementById("debug").textContent = "";
      const tipo = getTipo();
      const data = getData();

      const [respAlunos, respPresenca] = await Promise.all([
        fetch(`/api/alunos/carregar?tipo=${tipo}`),
        fetch(`/api/presenca/carregar?tipo=${tipo}&data=${data}`)
      ]);
      const jsonAlunos = await respAlunos.json();
      const jsonPresenca = await respPresenca.json();

      shaPresenca = jsonPresenca.sha || null;

      const jaPresentes = new Set(
        (jsonPresenca.conteudo || "").split("\n").map(n => n.trim()).filter(Boolean)
      );

      const div = document.getElementById("lista-alunos");
      div.innerHTML = "";

      if (!jsonAlunos.alunos || jsonAlunos.alunos.length === 0) {
        div.textContent = "Nenhum aluno cadastrado nessa turma.";
        document.getElementById("debug").textContent =
          "Resposta de /api/alunos/carregar: " + JSON.stringify(jsonAlunos);
        return;
      }

      jsonAlunos.alunos.forEach(nome => {
        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = nome;
        cb.checked = jaPresentes.has(nome);
        label.appendChild(cb);
        label.appendChild(document.createTextNode(" " + nome));
        div.appendChild(label);
        div.appendChild(document.createElement("br"));
      });
    }

    async function salvar() {
      const tipo = getTipo();
      const data = getData();

      const checkboxes = document.querySelectorAll("#lista-alunos input[type=checkbox]:checked");
      const presentes = Array.from(checkboxes).map(cb => cb.value);
      const conteudo = presentes.join("\n") + (presentes.length ? "\n" : "");

      document.getElementById("status").textContent = "Salvando...";
      const resp = await fetch("/api/presenca/salvar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tipo, data, conteudo, sha: shaPresenca })
      });
      const json = await resp.json();
      document.getElementById("status").textContent = json.ok ? "✓ Salvo!" : "✗ Erro ao salvar.";
      if (json.ok) await carregar();
    }

    document.getElementById("tipo").addEventListener("change", carregar);

    carregar();
  </script>
</body>
</html>
