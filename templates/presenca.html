<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Presença</title>
</head>
<body>
  <p><a href="/">← Menu</a></p>
  <h1>Presença</h1>

  <label for="tipo"><strong>Turma:</strong></label>
  <select id="tipo">
    <option value="iniciacao" {% if tipo == 'iniciacao' %}selected{% endif %}>Iniciação</option>
    <option value="aprimoramento" {% if tipo == 'aprimoramento' %}selected{% endif %}>Aprimoramento</option>
  </select>

  <p><strong>Data:</strong> {{ hoje }} (<span id="dia-semana"></span>)</p>

  <br>
  <div id="lista-alunos">Carregando...</div>
  <div id="debug" style="color:red;font-size:0.85em"></div>

  <br>
  <button onclick="salvar()">Enviar presença</button>
  <span id="status"></span>

  <script>
    const HOJE = "{{ hoje }}";

    // Dia da semana a partir de dd-mm-aa
    function diaSemana(ddmmaa) {
      const [d, m, a] = ddmmaa.split("-");
      const ano = parseInt(a) + 2000;
      const data = new Date(ano, parseInt(m) - 1, parseInt(d));
      return ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][data.getDay()];
    }

    document.getElementById("dia-semana").textContent = diaSemana(HOJE);

    function getTipo() {
      return document.getElementById("tipo").value;
    }

    async function carregar() {
      document.getElementById("lista-alunos").textContent = "Carregando...";
      document.getElementById("status").textContent = "";
      document.getElementById("debug").textContent = "";
      const tipo = getTipo();

      // Busca os três em paralelo
      const [respAlunos, respPresenca, respStats] = await Promise.all([
        fetch(`/api/alunos/carregar?tipo=${tipo}`),
        fetch(`/api/presenca/carregar?tipo=${tipo}&data=${HOJE}`),
        fetch(`/api/presenca/estatisticas?tipo=${tipo}`)
      ]);
      const jsonAlunos   = await respAlunos.json();
      const jsonPresenca = await respPresenca.json();
      const jsonStats    = await respStats.json();

      const jaPresentes = new Set(
        (jsonPresenca.conteudo || "").split("\n").map(n => n.trim()).filter(Boolean)
      );

      const stats      = jsonStats.stats      || {};
      const totalAulas = jsonStats.total_aulas || 0;

      const div = document.getElementById("lista-alunos");
      div.innerHTML = "";

      if (!jsonAlunos.alunos || jsonAlunos.alunos.length === 0) {
        div.textContent = "Nenhum aluno cadastrado nessa turma.";
        document.getElementById("debug").textContent =
          "Resposta de /api/alunos/carregar: " + JSON.stringify(jsonAlunos);
        return;
      }

      // Monta tabela
      const tabela = document.createElement("table");
      tabela.setAttribute("border", "1");
      tabela.setAttribute("cellpadding", "4");

      // Cabeçalho
      const thead = tabela.createTHead();
      const tr = thead.insertRow();
      ["Presente", "Aluno", "Presenças", "Faltas", "% Presença", "% Falta"].forEach(txt => {
        const th = document.createElement("th");
        th.textContent = txt;
        tr.appendChild(th);
      });

      // Linhas
      const tbody = tabela.createTBody();
      jsonAlunos.alunos.forEach(nome => {
        const s = stats[nome] || { presencas: 0, faltas: totalAulas, pct_presenca: 0, pct_falta: 100 };
        const row = tbody.insertRow();

        // Checkbox
        const tdCb = row.insertCell();
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = nome;
        cb.checked = jaPresentes.has(nome);
        tdCb.appendChild(cb);

        // Nome
        row.insertCell().textContent = nome;

        // Estatísticas
        row.insertCell().textContent = s.presencas;
        row.insertCell().textContent = s.faltas;
        row.insertCell().textContent = s.pct_presenca + "%";
        row.insertCell().textContent = s.pct_falta + "%";
      });

      div.appendChild(tabela);

      if (totalAulas > 0) {
        const p = document.createElement("p");
        p.textContent = `Total de aulas registradas: ${totalAulas}`;
        div.appendChild(p);
      }
    }

    async function salvar() {
      const tipo = getTipo();
      const checkboxes = document.querySelectorAll("#lista-alunos input[type=checkbox]:checked");
      const presentes = Array.from(checkboxes).map(cb => cb.value);
      const conteudo = presentes.join("\n") + (presentes.length ? "\n" : "");

      document.getElementById("status").textContent = "Salvando...";
      const resp = await fetch("/api/presenca/salvar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tipo, data: HOJE, conteudo })
      });
      const json = await resp.json();
      if (json.ok) {
        document.getElementById("status").textContent = "✓ Salvo!";
      } else {
        document.getElementById("status").textContent = "✗ Erro ao salvar: " + (json.github?.message || JSON.stringify(json.github));
      }
    }

    document.getElementById("tipo").addEventListener("change", carregar);
    carregar();
  </script>
</body>
</html>
