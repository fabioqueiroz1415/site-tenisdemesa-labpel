<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labpel - Presenca</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      perspective: 1000px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: #000;
      padding: 20px;
    }

    .menu-link {
      display: inline-block;
      background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
      color: #cc6ce7;
      text-decoration: none;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      border: 1px solid rgba(204, 108, 231, 0.3);
    }

    .menu-link:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
      border-color: #cc6ce7;
      box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
    }

    .menu-link:active {
      color: #444;
    }

    h1 {
      color: #cc6ce7;
      margin-bottom: 30px;
      font-size: 2em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .controls {
      background-color: #0a0a0a;
      padding: 20px;
      margin-bottom: 20px;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    label {
      font-weight: bold;
      margin-right: 10px;
      color: #cc6ce7;
    }

    select, input {
      background: #2c2c3e;
      color: #e0e0e0;
      border: 1px solid #cc6ce7;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
    }

    select:hover, input:hover {
      background: #3c3c5e;
    }

    button {
      background: linear-gradient(135deg, #2c2c3e 0%, #1e1e2e 100%);
      color: #cc6ce7;
      border: 1px solid rgba(204, 108, 231, 0.3);
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-left: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3c3c5e 0%, #2e2e4e 100%);
      border-color: #cc6ce7;
      box-shadow: 0 4px 15px rgba(204, 108, 231, 0.3);
    }

    button:active {
      color: #444;
    }

    table {
      width: 100%;
      margin-top: 20px;
      background-color: #0a0a0a;
      border-collapse: collapse;
    }

    th {
      background: #1a1a2e;
      color: #cc6ce7;
      padding: 12px;
      text-align: left;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    tr:hover {
      background: rgba(204, 108, 231, 0.05);
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .info {
      background-color: #0a0a0a;
      padding: 15px;
      margin-bottom: 20px;
      border-left: 4px solid #cc6ce7;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    #status {
      margin-left: 15px;
      font-weight: bold;
    }

    .debug {
      color: #ff6b6b;
      font-size: 0.85em;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="menu-link"> Voltar ao Menu</a>
    <h1>Presenca - Labpel Tenis de Mesa</h1>

    <div class="controls">
      <label>Turma:</label>
      <select id="tipo">
        <option value="iniciacao">Iniciacao</option>
        <option value="aprimoramento">Aprimoramento</option>
      </select>
    </div>

    <div class="controls">
      <label>Data:</label>
      <input type="date" id="data-input" />
    </div>

    <div id="lista-alunos">Carregando...</div>
    <div id="debug" class="debug"></div>

    <div style="margin-top: 20px;">
      <button onclick="salvar()">Salvar presenca</button>
      <span id="status"></span>
    </div>
  </div>

  <script>
    let dataAtual = "";

    function formatarDataParaArquivo(dataStr) {
      const [ano, mes, dia] = dataStr.split("-");
      const anoCurto = ano.slice(-2);
      return `${dia}-${mes}-${anoCurto}`;
    }

    function formatarDataParaExibicao(dataArquivo) {
      const [d, m, a] = dataArquivo.split("-");
      return `${d}/${m}/20${a}`;
    }

    function getDataHoje() {
      const hoje = new Date();
      const ano = hoje.getFullYear();
      const mes = String(hoje.getMonth() + 1).padStart(2, '0');
      const dia = String(hoje.getDate()).padStart(2, '0');
      return `${ano}-${mes}-${dia}`;
    }

    function diaSemana(dataArquivo) {
      const [d, m, a] = dataArquivo.split("-");
      const ano = parseInt(a) + 2000;
      const data = new Date(ano, parseInt(m) - 1, parseInt(d));
      return ["Domingo", "Segunda", "Terca", "Quarta", "Quinta", "Sexta", "Sabado"][data.getDay()];
    }

    async function carregar() {
      const tipo = document.getElementById("tipo").value;
      const inputDate = document.getElementById("data-input").value;

      if (!inputDate) {
        alert("Selecione uma data!");
        return;
      }

      dataAtual = formatarDataParaArquivo(inputDate);

      document.getElementById("lista-alunos").textContent = "Carregando...";
      document.getElementById("status").textContent = "";
      document.getElementById("debug").textContent = "";

      const [respAlunos, respPresenca, respStats] = await Promise.all([
        fetch(`/api/alunos/carregar?tipo=${tipo}`),
        fetch(`/api/presenca/carregar?tipo=${tipo}&data=${dataAtual}`),
        fetch(`/api/presenca/estatisticas?tipo=${tipo}`)
      ]);

      const jsonAlunos   = await respAlunos.json();
      const jsonPresenca = await respPresenca.json();
      const jsonStats    = await respStats.json();

      const jaPresentes = new Set(
        (jsonPresenca.conteudo || "").split("\n").map(n => n.trim()).filter(Boolean)
      );

      const stats      = jsonStats.stats      || {};
      const totalAulas = jsonStats.total_aulas || 0;

      const div = document.getElementById("lista-alunos");
      div.innerHTML = "";

      if (!jsonAlunos.alunos || jsonAlunos.alunos.length === 0) {
        div.innerHTML = `<p style="color: #ffa500;">Nenhum aluno cadastrado nessa turma.</p>
                        <p><small>Vá em "Gerenciar Alunos" para adicionar alunos primeiro.</small></p>`;
        document.getElementById("debug").textContent = "";
        return;
      }

      const infoDiv = document.createElement("div");
      infoDiv.className = "info";

      const nomeTurma = tipo === "iniciacao" ? "Iniciacao" : "Aprimoramento";
      const dataExibicao = formatarDataParaExibicao(dataAtual);
      const diaSemanaStr = diaSemana(dataAtual);

      infoDiv.innerHTML = `
        <strong>Turma:</strong> ${nomeTurma}<br>
        <strong>Data:</strong> ${dataExibicao} (${diaSemanaStr})<br>
        ${jsonPresenca.conteudo ? '<span style="color: #cc6ce7;">Registro existente</span>' : '<span style="color: #ffa500;">Nenhum registro para esta data</span>'}
      `;
      div.appendChild(infoDiv);

      const tabela = document.createElement("table");

      const thead = tabela.createTHead();
      const tr = thead.insertRow();
      ["Presente", "Aluno", "Presencas", "Faltas", "% Presenca", "% Falta"].forEach(txt => {
        const th = document.createElement("th");
        th.textContent = txt;
        tr.appendChild(th);
      });

      const tbody = tabela.createTBody();
      jsonAlunos.alunos.forEach(nome => {
        const s = stats[nome] || { presencas: 0, faltas: totalAulas, pct_presenca: 0, pct_falta: 100 };
        const row = tbody.insertRow();

        const tdCb = row.insertCell();
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = nome;
        cb.checked = jaPresentes.has(nome);
        tdCb.appendChild(cb);
        tdCb.style.textAlign = "center";

        row.insertCell().textContent = nome;
        row.insertCell().textContent = s.presencas;
        row.insertCell().textContent = s.faltas;
        row.insertCell().textContent = s.pct_presenca + "%";
        row.insertCell().textContent = s.pct_falta + "%";
      });

      div.appendChild(tabela);

      if (totalAulas > 0) {
        const p = document.createElement("p");
        p.style.marginTop = "15px";
        p.style.fontSize = "0.9em";
        p.style.color = "#888";
        p.innerHTML = `<strong>Total de aulas registradas:</strong> ${totalAulas}`;
        div.appendChild(p);
      }
    }

    async function salvar() {
      const tipo = document.getElementById("tipo").value;
      const checkboxes = document.querySelectorAll("#lista-alunos input[type=checkbox]");
      const presentes = Array.from(checkboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

      const conteudo = presentes.join("\n") + (presentes.length ? "\n" : "");
      const dataExibicao = formatarDataParaExibicao(dataAtual);

      if (!confirm(`Salvar presenca para ${dataExibicao}?\n${presentes.length} aluno(s) presente(s).`)) {
        return;
      }

      const statusSpan = document.getElementById("status");
      statusSpan.textContent = "Salvando...";
      statusSpan.style.color = "#cc6ce7";

      const resp = await fetch("/api/presenca/salvar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tipo, data: dataAtual, conteudo })
      });

      const json = await resp.json();
      if (json.ok) {
        statusSpan.textContent = "Salvo com sucesso!";
        statusSpan.style.color = "#cc6ce7";
        setTimeout(() => carregar(), 1000);
      } else {
        statusSpan.textContent = "Erro ao salvar: " + (json.github?.message || JSON.stringify(json.github));
        statusSpan.style.color = "#ff6b6b";
      }
    }

    document.getElementById("data-input").value = getDataHoje();
    document.getElementById("tipo").addEventListener("change", () => carregar());
    document.getElementById("data-input").addEventListener("change", () => carregar());

    carregar();
  </script>
</body>
</html>
